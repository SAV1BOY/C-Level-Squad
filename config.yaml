# Descrição: Manifesto central que roteia tasks → agents → frameworks
#             → checklists → templates → registries para o C-Level OS.
# ============================================================

squad:
  name: c-level
  version: "2.0.0"
  description: "C-Level OS: visão, operação, marketing, tecnologia, informação, IA"
  chief_agent: vision-chief
  total_agents: 8
  monthly_budget: "R$ 540K"
  methodology: "HRM (Hierarchical Reasoning Model) + Prompt Engineering Avançado"

# ============================================================
# PRINCÍPIOS OPERACIONAIS
# ============================================================
principles:
  - id: artifacts_over_opinions
    rule: "Se não está escrito, não é decisão — é conversa."
    enforcement: "Todo output deve gerar registro em data/registries/ ou data/decisions/"

  - id: cadence_is_the_os
    rule: "Cadência (WBR/MBR/QBR) é o sistema operacional. Sem cadência, sem controle."
    enforcement: "WBR semanal, MBR mensal, QBR trimestral — inegociável."

  - id: accountability_by_default
    rule: "Dono, prazo, métrica — sempre. Sem dono = sem responsável = não acontece."
    enforcement: "Todo item de ação deve ter DRI (Directly Responsible Individual)."

  - id: kill_before_it_kills_you
    rule: "Kill criteria obrigatório para toda iniciativa. Se não define quando parar, não sabe o que está fazendo."
    enforcement: "Revisão trimestral de kill list via checklists/execution/kill-criteria-quality.md"

  - id: cross_squad_contracts
    rule: "SLAs e handoffs explícitos entre squads. Sem contrato = sem entrega."
    enforcement: "Handoffs documentados via templates/operational/cross-squad-handoff.md"

  - id: ai_as_leverage
    rule: "IA como alavanca real, não como buzzword. ROI medido, não assumido."
    enforcement: "Evals mensais via caio-architect, ROI validado trimestralmente."

  - id: compounding_decisions
    rule: "Decisões que compõem no longo prazo > decisões que parecem boas no curto."
    enforcement: "Decision quality review trimestral via workflows/18-decision-quality-review.md"

  - id: evidence_over_intuition
    rule: "Base-rates, dados e evidências primeiro. Intuição calibrada, não cega."
    enforcement: "Toda decisão estratégica requer data/research/ como input."

  - id: simplicity_by_design
    rule: "Complexidade é o inimigo. Se precisa de 15 minutos para explicar, simplifique."
    enforcement: "Checklist de simplificação em todo output de estratégia."

