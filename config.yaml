# ============================================================
# CROSS-SQUAD INTEGRATION (bidirecional)
# ============================================================
cross_squad:
  brand_squad:
    description: "Squad de marca: identidade, propósito, posicionamento visual"
    c_level_owner: cmo-architect
    handoff_to_brand:
      - "positioning thesis → brand/frameworks"
      - "mission statement → brand/voice"
      - "brand guidelines → brand/reference"
    handoff_from_brand:
      - "brand health metrics → data/metrics/growth/"
      - "competitive positioning → data/research/competitive/"
      - "brand audit results → data/registries/culture-registry.yaml"
    shared_assets: [positioning-thesis, brand-purpose, visual-identity]
    sla: "48h para handoffs, 1 semana para entregas"

  copy_squad:
    description: "Squad de copy: messaging, conversão, persuasão"
    c_level_owner: cmo-architect
    handoff_to_copy:
      - "messaging framework → copy/frameworks"
      - "value proposition → copy/templates"
      - "ICP profiles → copy/reference"
    handoff_from_copy:
      - "conversion data → data/metrics/growth/"
      - "tested messaging → data/registries/decision-registry.yaml"
      - "copy performance → data/research/customer/"
    shared_assets: [value-proposition, messaging-framework, icp-profiles]
    sla: "24h para briefs, 48h para entregas"

  storytelling_squad:
    description: "Squad de storytelling: narrativa, conteúdo, autoridade"
    c_level_owner: cmo-architect
    secondary_owner: vision-chief
    handoff_to_storytelling:
      - "company narrative → storytelling/frameworks"
      - "founder story → storytelling/reference"
      - "thought leadership topics → storytelling/tasks"
    handoff_from_storytelling:
      - "narrative performance → data/metrics/growth/"
      - "pitch narratives → data/memos/"
      - "content metrics → data/research/customer/"
    shared_assets: [company-narrative, fundraising-story, thought-leadership]
    sla: "48h para briefs, 1 semana para entregas"

  movement_squad:
    description: "Squad de movimento: comunidade, cultura, engajamento"
    c_level_owner: cmo-architect
    handoff_to_movement:
      - "mission/values → movement/frameworks"
      - "culture thesis → movement/reference"
      - "community strategy → movement/tasks"
    handoff_from_movement:
      - "community health → data/metrics/org-health/"
      - "cultural insights → data/research/customer/"
      - "engagement metrics → data/metrics/growth/"
    shared_assets: [mission-thesis, cultural-signals, community-health]
    sla: "48h para handoffs, 1 semana para entregas"

  traffic_squad:
    description: "Squad de tráfego: aquisição paga, orgânica, performance"
    c_level_owner: cmo-architect
    handoff_to_traffic:
      - "budget allocation → traffic/data"
      - "channel constraints → traffic/strategy"
      - "campaign briefs → traffic/tasks"
    handoff_from_traffic:
      - "channel ROI → data/metrics/growth/"
      - "acquisition data → data/research/customer/"
      - "attribution data → data/registries/metric-registry.yaml"
    shared_assets: [budget-allocation, channel-roi, attribution-model]
    sla: "24h para ajustes, 48h para reports"

  design_squad:
    description: "Squad de design: experiência, sistema visual, entrega"
    c_level_owner: cto-architect
    handoff_to_design:
      - "product strategy → design/tasks"
      - "UX priorities → design/frameworks"
      - "user research → design/reference"
    handoff_from_design:
      - "UX metrics → data/metrics/growth/"
      - "design system → data/registries/system-registry.yaml"
      - "usability data → data/research/customer/"
    shared_assets: [product-metrics, design-system, user-research]
    sla: "48h para handoffs, 1 semana para entregas"

  data_squad:
    description: "Squad de dados: métricas, evidência, decisão"
    c_level_owner: cio-engineer
    secondary_owner: coo-orchestrator
    handoff_to_data:
      - "metric definitions → data/registries/metric-registry.yaml"
      - "scorecard needs → data/tasks"
      - "experiment designs → data/research/"
    handoff_from_data:
      - "metrics dashboards → data/metrics/"
      - "experiment results → data/research/"
      - "evidence packs → data/memos/"
    shared_assets: [metric-registry, experiment-results, board-scorecard]
    sla: "24h para queries, 48h para análises"

  cybersecurity_squad:
    description: "Squad de cybersecurity: risco, compliance, segurança"
    c_level_owner: cio-engineer
    secondary_owner: cto-architect
    handoff_to_cyber:
      - "risk gates → cybersecurity/checklists"
      - "compliance requirements → cybersecurity/tasks"
      - "security policies → cybersecurity/reference"
    handoff_from_cyber:
      - "risk assessments → data/registries/risk-registry.yaml"
      - "incident reports → data/registries/lessons-learned.yaml"
      - "compliance status → data/registries/policy-registry.yaml"
    shared_assets: [risk-register, compliance-status, security-posture]
    sla: "4h para incidentes, 24h para assessments"

  advisory_board:
    description: "Advisory Board: orientação estratégica, rede, governança"
    c_level_owner: vision-chief
    handoff_to_advisory:
      - "strategic questions → advisory/tasks"
      - "board prep → advisory/templates"
      - "decision memos → advisory/reference"
    handoff_from_advisory:
      - "strategic guidance → data/decisions/"
      - "decision quality review → data/registries/lessons-learned.yaml"
      - "network intros → data/registries/vendor-registry.yaml"
    shared_assets: [strategic-decisions, board-scorecard, network-map]
    sla: "1 semana para orientações, 48h para revisões"

# ============================================================
# QUALITY GATES
# ============================================================
quality_gates:
  mandatory:
    description: "Gates obrigatórios para QUALQUER decisão ou entrega"
    gates:
      - checklist: checklists/exec-decision-memo-quality.md
        rule: "Toda decisão tem memo com contexto, opções, trade-offs, recomendação, owner, data"
      - checklist: checklists/ralphloop-quality.md
        rule: "Todo ciclo registra aprendizado: registrar → medir → retroalimentar"
      - checklist: checklists/cross-squad-handoff-quality.md
        rule: "Todo handoff é explícito: inputs/outputs, DoD/DoR, owners, evidências"

  per_domain:
    strategy:
      - checklists/strategy-memo-quality.md
      - checklists/okr-quality.md
