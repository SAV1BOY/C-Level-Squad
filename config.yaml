      cadence: weekly
    - name: strategic_bet_success_rate
      description: "Taxa de sucesso das bets estratégicas"
      owner: vision-chief
      cadence: quarterly
    - name: moat_strength_score
      description: "Score de força do moat competitivo"
      owner: vision-chief
      cadence: quarterly
    - name: market_position_score
      description: "Score de posição de mercado"
      owner: vision-chief
      cadence: quarterly

  growth:
    - name: revenue_growth_rate
      description: "Taxa de crescimento de receita"
      owner: cmo-architect
      cadence: monthly
    - name: customer_acquisition_cost
      description: "CAC (Customer Acquisition Cost)"
