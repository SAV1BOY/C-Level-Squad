# ============================================================================
# OKR Registry
# ============================================================================
# Central registry of Objectives and Key Results for the C-Level Squad.
# OKRs are set quarterly and reviewed weekly. Each objective is owned by
# a specific agent, with key results that are measurable and time-bound.
#
# Confidence levels: 0.0 to 1.0 (probability of achieving the target)
# Statuses: on_track, at_risk, behind, achieved, missed, deferred
# ============================================================================

schema:
  cycle:
    type: string
    format: "QN-YYYY"
    description: "Quarter and year (e.g., Q1-2026)"
    required: true
  objective:
    type: object
    properties:
      id:
        type: string
        format: "OBJ-YYYY-QN-NN"
        description: "Unique objective identifier"
        required: true
      description:
        type: text
        description: "Clear statement of what we want to achieve"
        required: true
      owner:
        type: string
        description: "Agent responsible for this objective"
        required: true
      status:
        type: enum
        values: [on_track, at_risk, behind, achieved, missed, deferred]
        description: "Current progress status"
        required: true
  key_results:
    type: list
    items:
      id:
        type: string
        format: "KR-YYYY-QN-NN-NN"
        description: "Unique key result identifier"
      description:
        type: text
        description: "Measurable outcome statement"
      target:
        type: number_or_string
        description: "Target value to achieve"
      current:
        type: number_or_string
        description: "Current measured value"
      confidence:
        type: float
        range: [0.0, 1.0]
        description: "Probability of hitting the target (updated weekly)"
      status:
        type: enum
        values: [on_track, at_risk, behind, achieved, missed, deferred]
    description: "Measurable results that indicate objective completion"
    required: true
  linked_initiatives:
    type: list
    description: "Initiative IDs from initiative-registry that support this OKR"
    required: false

