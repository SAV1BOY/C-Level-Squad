# =============================================================================
# Initiative Registry
# =============================================================================
# Central registry of all strategic initiatives undertaken by the C-Level Squad.
# Tracks lifecycle from proposal through completion, including health, budget,
# dependencies, milestones, and kill criteria.
#
# Health: green = on track, yellow = at risk, red = blocked or failing
# Status Lifecycle: proposed -> approved -> active -> completed | killed | paused
# =============================================================================

schema:
  id:
    type: string
    format: "INIT-YYYY-NNN"
    description: "Unique initiative identifier"
    required: true
  name:
    type: string
    description: "Descriptive name of the initiative"
    required: true
  type:
    type: string
    description: "Category from initiative-taxonomy (e.g., product, infrastructure, growth, governance)"
    required: true
  owner:
    type: string
    description: "Agent or role accountable for delivery"
    required: true
  sponsor:
    type: string
    description: "Executive sponsor providing strategic oversight"
    required: true
  status:
    type: enum
    values: [proposed, approved, active, paused, completed, killed]
    description: "Current lifecycle status"
    required: true
  start_date:
    type: date
    description: "Actual or planned start date"
    required: true
  target_end:
    type: date
    description: "Planned completion date"
    required: true
  actual_end:
    type: date
    description: "Actual completion date (null if still active)"
    required: false
  health:
    type: enum
    values: [green, yellow, red]
    description: "Current health indicator"
    required: true
  kill_criteria:
    type: list
    description: "Conditions under which this initiative should be terminated"
    required: true
  budget:
    type: object
    properties:
      allocated: "number - total budget allocated"
      spent: "number - amount spent to date"
      currency: "string - currency code (USD)"
    required: true
  resources:
    type: list
    description: "Teams, headcount, or roles assigned"
    required: true
  dependencies:
    type: list
    description: "Other initiative IDs or external dependencies"
    required: false
  milestones:
    type: list
    items:
      name: "string"
      target_date: "date"
      status: "enum [pending, completed, missed, at_risk]"
    description: "Key milestones with dates and statuses"
    required: true
  metrics:
    type: list
    description: "Metric IDs from metric-registry used to measure success"
    required: true
  last_review:
    type: date
    description: "Date of most recent status review"
    required: true

