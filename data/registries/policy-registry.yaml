# =============================================================================
# Policy Registry
# =============================================================================
# Registry of all organizational policies. Tracks versioning, ownership,
# review schedules, compliance requirements, and related operational
# checklists.
#
# Status: draft -> active -> under_review -> superseded -> archived
# Review Cadence: quarterly, semi-annually, annually
# =============================================================================

schema:
  id:
    type: string
    format: "POL-NNN"
    description: "Unique policy identifier"
    required: true
  name:
    type: string
    description: "Policy name"
    required: true
  domain:
    type: string
    description: "Domain this policy covers (e.g., security, data, ai, hr, finance, operations, marketing, engineering)"
    required: true
  version:
    type: string
    description: "Semantic version (MAJOR.MINOR)"
    required: true
  effective_date:
    type: date
    description: "Date the current version became effective"
    required: true
  owner:
    type: string
    description: "Agent or role responsible for maintaining this policy"
    required: true
  review_cadence:
    type: enum
    values: [quarterly, semi-annually, annually]
    description: "How often this policy is formally reviewed"
    required: true
  last_review:
    type: date
    description: "Date of most recent review"
    required: true
  next_review:
    type: date
    description: "Scheduled date for next review"
    required: true
  status:
    type: enum
    values: [draft, active, under_review, superseded, archived]
    description: "Current lifecycle status"
    required: true
  compliance_requirements:
    type: list
    description: "Regulatory or compliance frameworks this policy addresses"
    required: false
  related_checklists:
    type: list
    description: "IDs or names of operational checklists that implement this policy"
    required: false

