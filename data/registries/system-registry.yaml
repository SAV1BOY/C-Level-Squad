# =============================================================================
# System Registry
# =============================================================================
# Registry of all internal systems, platforms, and tools used across the
# organization. Tracks ownership, costs, integrations, health, and
# replacement planning.
#
# Categories: ERP, CRM, HR, Marketing, Engineering, Data, AI/ML, Security,
#             Communication, Finance, Monitoring, Analytics
# Health: healthy, degraded, critical, decommissioning
# =============================================================================

schema:
  id:
    type: string
    format: "SYS-NNN"
    description: "Unique system identifier"
    required: true
  name:
    type: string
    description: "System or platform name"
    required: true
  category:
    type: enum
    values: [ERP, CRM, HR, Marketing, Engineering, Data, "AI/ML", Security, Communication, Finance, Monitoring, Analytics]
    description: "Primary system category"
    required: true
  vendor:
    type: string
    description: "Vendor or provider name (or 'Internal' for homegrown)"
    required: true
  version:
    type: string
    description: "Current version or release"
    required: true
  owner:
    type: string
    description: "Agent or role responsible for this system"
    required: true
  users:
    type: integer
    description: "Number of active users or seats"
    required: true
  cost_monthly:
    type: number
    description: "Monthly cost in USD"
    required: true
  contract_end:
    type: date
    description: "Contract or license expiration date"
    required: true
  integration_points:
    type: list
    description: "Other system IDs this system integrates with"
    required: false
  sla:
    type: object
    properties:
      uptime_target: "string - e.g., 99.9%"
      support_response: "string - e.g., 4 hours for P1"
    description: "Agreed service level"
    required: true
  health:
    type: enum
    values: [healthy, degraded, critical, decommissioning]
    description: "Current operational health"
    required: true
  last_audit:
    type: date
    description: "Date of last security or compliance audit"
    required: true
  replacement_candidate:
    type: string
    description: "Proposed replacement system if applicable (null if none)"
    required: false

